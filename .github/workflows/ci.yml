name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Pruebas y calidad
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd, bcmath, pdo_mysql, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependencias y build del frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Análisis estático (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pruebas (SQLite)
        run: php artisan test

      - name: Pruebas (MariaDB)
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
        run: php artisan test
